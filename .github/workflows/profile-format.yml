name: Profile format helper

on:
  push:
    branches:
      - fix/private-own-profile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/private-own-profile

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format changed profile files
        run: >-
          npx prettier --write
          public/css/profile-social.css
          public/js/views.js
          public/js/views/profile-social.js
          public/style.css
          tests/profile-social.test.js

      - name: Commit formatting
        shell: bash
        run: |
          git add public/css/profile-social.css public/js/views.js public/js/views/profile-social.js public/style.css tests/profile-social.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(profile): apply project formatting"
          git push origin HEAD:fix/private-own-profile
