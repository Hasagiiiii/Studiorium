name: Temporary format PR43

on:
  push:
    branches:
      - agent/communities-foundation-v341

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format community files
        run: >-
          npx prettier --write
          public/js/events/communities.js
          public/js/views/communities.js
          src/server/routes/communities.js
          src/server/routes/discussions.js
          src/server/routes/tech.js

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet -- \
            public/js/events/communities.js \
            public/js/views/communities.js \
            src/server/routes/communities.js \
            src/server/routes/discussions.js \
            src/server/routes/tech.js; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public/js/events/communities.js \
            public/js/views/communities.js \
            src/server/routes/communities.js \
            src/server/routes/discussions.js \
            src/server/routes/tech.js
          git commit -m "Format community foundation files"
          git push origin HEAD:agent/communities-foundation-v341
