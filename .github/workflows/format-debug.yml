name: Format Debug

on:
  push:
    branches:
      - feat/lorion-social-core

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Print Prettier diff
        run: |
          npx prettier --write v4/apps/api/src/features/auth/handler.ts
          git diff --no-ext-diff -- v4/apps/api/src/features/auth/handler.ts
