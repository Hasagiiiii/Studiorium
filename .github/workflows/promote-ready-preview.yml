name: Promote ready preview

on:
  push:
    branches: [agent/button-dialog-ux-v326]
    paths: [.github/workflows/promote-ready-preview.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout utility branch
        uses: actions/checkout@v6
        with:
          ref: agent/button-dialog-ux-v326

      - name: Promote READY preview to production
        id: promote
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: |
          set -u
          TOKEN="${VERCEL_TOKEN:-${VERCEL_ACCESS_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "result=NO_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(curl -sS -o /tmp/promote.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.vercel.com/v10/projects/prj_zMQqgWtDBX1kC6sxhbpNtRX8CJeW/promote/dpl_NBrtNAZ1f4YBSXcxDiRdKdaNzUwS?teamId=team_pDupuD5MMUlz2rnoDeq9vXYM")
          echo "Vercel promote HTTP status: $STATUS"
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
            echo "result=PROMOTED" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED_$STATUS" >> "$GITHUB_OUTPUT"
          fi

      - name: Record result on utility branch
        env:
          RESULT: ${{ steps.promote.outputs.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "${RESULT:-FAILED}" > .github/PROMOTION_STATUS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/PROMOTION_STATUS
          git commit -m "chore: registra status da promoção Vercel"
          git push origin HEAD:agent/button-dialog-ux-v326
