name: V4 Autofmt

on:
  push:
    branches:
      - rebuild/lorion-v4-clean
    paths:
      - 'v4/**'
      - 'SECURITY.md'
      - 'vercel.json'
      - '.github/workflows/v4-validate.yml'
      - '.github/workflows/v4-autofmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format v4
        run: npx prettier --write SECURITY.md vercel.json v4 .github/workflows/v4-validate.yml .github/workflows/v4-autofmt.yml

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SECURITY.md vercel.json v4 .github/workflows/v4-validate.yml .github/workflows/v4-autofmt.yml
          git commit -m "style(v4): aplicar formatação final"
          git push origin HEAD:rebuild/lorion-v4-clean
