name: Cleanup duplicate hubs

on:
  push:
    branches:
      - fix/private-own-profile

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/private-own-profile
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Consolidate remaining duplicate code paths
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after !== before) fs.writeFileSync(path, after);
          }

          edit('public/js/views/communities.js', (text) => {
            const marker = `    <p class="community-section-copy">\n      Este é o único hub de criação do Studiorium. Explore modelos, crie materiais ou abra uma\n      ferramenta específica sem manter catálogos paralelos.\n    </p>\n    <div class="grid grid3">`;
            const replacement = `    <p class="community-section-copy">\n      Este é o único hub de criação do Studiorium. Explore modelos, crie materiais ou abra uma\n      ferramenta específica sem manter catálogos paralelos.\n    </p>\n    <section class="studio-guided-start" aria-label="Criação assistida">\n      <div>\n        <span class="eyebrow">Criação assistida</span>\n        <h3>Comece pela intenção, não por outra página.</h3>\n        <p>\n          Os roteiros são locais e transparentes: a interface não finge geração por IA nem envia\n          seu conteúdo para um provedor externo.\n        </p>\n      </div>\n      <div class="grid grid3 studio-guided-grid">\n        <article class="studio-guided-option">\n          <h3>Banner científico</h3>\n          <p>Estrutura acadêmica com introdução, metodologia, resultados e referências.</p>\n          <button class="outline" type="button" data-guided-template="banner">Preparar</button>\n        </article>\n        <article class="studio-guided-option">\n          <h3>Apresentação</h3>\n          <p>Contexto, questão central, evidências e síntese em formato de apresentação.</p>\n          <button class="outline" type="button" data-guided-template="slides">Preparar</button>\n        </article>\n        <article class="studio-guided-option">\n          <h3>Material de estudo</h3>\n          <p>Conceitos-chave, resumo, prática e fontes para revisão organizada.</p>\n          <button class="outline" type="button" data-guided-template="estudo">Preparar</button>\n        </article>\n      </div>\n    </section>\n    <div class="grid grid3">`;
            return text.includes(marker) ? text.replace(marker, replacement) : text;
          });

          edit('public/js/views/home-library.js', (text) => {
            text = text.replace('        ...boot.templates.map((t) => t.category),\n', '');
            text = text.replace("  let pubs = ['modelos', 'livros'].includes(tipo)", "  let pubs = tipo === 'livros'");
            const templateBlock = `  let templates = ['pesquisas', 'livros'].includes(tipo)\n    ? []\n    : boot.templates.filter(\n        (t) => contains(t, q) && (!area || t.category === area) && !nivel && !autor && !palavra,\n      );\n`;
            text = text.replace(templateBlock, '');
            text = text.replace("  let books = ['pesquisas', 'modelos'].includes(tipo)", "  let books = tipo === 'pesquisas'");
            text = text.replace('  const total = pubs.length + templates.length + books.length;', '  const total = pubs.length + books.length;');
            text = text.replace('  const circulatingTopics = emergentTopics([...boot.publications, ...boot.templates]);', '  const circulatingTopics = emergentTopics(boot.publications);');
            text = text.replace('            O catálogo central do Studiorium. Encontre pesquisas, trabalhos acadêmicos, modelos e\n            autores por tema, área, nível, autoria ou palavras-chave.', '            O catálogo central do Studiorium. Encontre pesquisas, trabalhos acadêmicos, livros e\n            autores por tema, área, nível, autoria ou palavras-chave.');
            text = text.replace(`            <div class="stat">\n              <strong>\${boot.templates.length}</strong><span>Modelos no acervo</span>\n            </div>\n`, '');
            text = text.replace(`                <option value="modelos" \${tipo === 'modelos' ? 'selected' : ''}>\n                  Modelos do acervo\n                </option>\n`, '');
            text = text.replace('                  <strong>Temas em circulação no acervo</strong>', '                  <strong>Temas em circulação na biblioteca</strong>');
            const modelSection = `            : ''}\${templates.length\n            ? html\`<div class="sectionhead library-section-gap">\n                  <div>\n                    <div class="eyebrow">Catalogus exemplorum</div>\n                    <h2>Modelos do acervo</h2>\n                    <p>\n                      Estruturas prontas para adaptar em atividades escolares, universitárias e\n                      científicas.\n                    </p>\n                  </div>\n                  \${link('/acervo', 'Abrir acervo →', 'linkbtn')}\n                </div>\n                <div class="grid grid3">\${templates.map(libraryTemplateCard).join('')}</div>\`\n            : ''}\${!total`;
            text = text.replace(modelSection, `            : ''}\${!total`);
            return text;
          });

          edit('public/js/views/research.js', (text) => {
            let start = text.indexOf('function pesquisas() {');
            let end = text.indexOf('function researchDetail', start);
            if (start >= 0 && end > start) text = text.slice(0, start) + text.slice(end);
            start = text.indexOf('function autores() {');
            end = text.indexOf('function projectCard', start);
            if (start >= 0 && end > start) text = text.slice(0, start) + text.slice(end);
            text = text.replace(
              'export { pesquisas, researchDetail, projetos, publicProjectDetail, autores, authorDetail };',
              'export { researchDetail, projetos, publicProjectDetail };',
            );
            return text;
          });

          edit('public/js/views.js', (text) => text
            .replace('export { pesquisas, researchDetail, projetos, publicProjectDetail } from \'./views/research.js\';', "export { researchDetail, projetos, publicProjectDetail } from './views/research.js';")
            .replace("export { templateStudio } from './views/template-studio-private-v329.js';\n", ''));

          edit('public/js/router.js', (text) => text
            .replace('  pesquisas,\n', '')
            .replace('  templateStudio,\n', ''));

          edit('tests/content-management-v329.test.js', (text) => text
            .replace("  const templates = read('public/js/views/template-studio-private-v329.js');", "  const workspaceTemplates = read('public/js/views/workspace-personal-v330.js');")
            .replace("  assert.match(templates, /Publicados \\(\\$\\{published\\.length\\}\\)/);", "  assert.match(workspaceTemplates, /Seus templates/);\n  assert.match(workspaceTemplates, /Publicados \\(\\$\\{published\\.length\\}\\)/);\n  assert.match(workspaceTemplates, /data-workspace-templates/);")
            .replace('  assert.doesNotMatch(templates, /grid-template-columns/);', '  assert.doesNotMatch(workspaceTemplates, /grid-template-columns/);'));

          edit('tests/creative-assistant.test.js', (text) => text.replace(
            "  const studio = read('public/js/views/template-studio-private-v329.js');",
            "  const studio = read('public/js/views/communities.js');",
          ));

          edit('tests/ui-responsibility.test.js', (text) => {
            if (!text.includes('Modelos não voltam para a Biblioteca')) {
              text += `\ntest('Modelos não voltam para a Biblioteca nem para um Estúdio-lista', () => {\n  const library = read('public/js/views/home-library.js');\n  const views = read('public/js/views.js');\n  assert.doesNotMatch(library, /<option value="modelos"/);\n  assert.doesNotMatch(library, /<h2>Modelos do acervo<\\/h2>/);\n  assert.doesNotMatch(views, /template-studio-private-v329/);\n  assert.equal(fs.existsSync(path.join(root, 'public/js/views/template-studio-private-v329.js')), false);\n});\n`;
            }
            return text;
          });

          if (fs.existsSync('public/js/views/template-studio-private-v329.js')) {
            fs.rmSync('public/js/views/template-studio-private-v329.js');
          }
          NODE
      - name: Format changed files
        run: >-
          npx prettier --write
          public/js/views/communities.js
          public/js/views/home-library.js
          public/js/views/research.js
          public/js/views.js
          public/js/router.js
          public/js/views/workspace-personal-v330.js
          tests/content-management-v329.test.js
          tests/creative-assistant.test.js
          tests/ui-responsibility.test.js
      - name: Commit cleanup
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): remove obsolete duplicate hubs"
          git push origin HEAD:fix/private-own-profile
