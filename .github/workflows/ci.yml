name: Studiorium CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate project structure and syntax
        run: npm run check

      - name: Export Prettier output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: |
            public/css/interactions-v326.css
            public/js/admin-news-feature.js
            public/js/admin-published-actions-v329.js
            public/js/events/admin.js
            public/js/events/news.js
            public/js/events/projects.js
            public/js/events/template-studio.js
            public/js/views/news.js
            public/js/views/template-studio-private-v329.js
            public/js/views/workspace-personal-v329.js
            src/server/routes/discussions.js
            src/server/routes/news.js
            tests/library-mobile-layout.test.js

      - name: Run tests
        run: npm test
