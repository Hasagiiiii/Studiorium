name: Studiorium CI

on:
  push:
    branches:
      - main
      - 'maintenance/**'
      - 'agent/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate project structure and syntax
        run: npm run check

      - name: Run tests
        run: npm test
