name: Studiorium CI

on:
  push:
    branches:
      - main
      - 'maintenance/**'
      - 'agent/**'
      - 'security/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Check tracked files and Git history for secrets
        run: node scripts/check-secrets.js

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate project structure and syntax
        run: npm run check

      - name: Show formatting diff on validation failure
        if: failure()
        run: |
          npx prettier --write .
          git diff -- .

      - name: Run tests
        run: npm test
