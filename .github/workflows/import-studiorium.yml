name: Importar Studiorium

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch da importação
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Montar e validar pacote
        shell: bash
        run: |
          set -euo pipefail
          cat .studiorium.part00a .studiorium.part00b .studiorium.part01 .studiorium.part02 .studiorium.part03 .studiorium.part04 > studiorium.b64
          base64 --decode studiorium.b64 > studiorium-source.tgz
          echo '479902c72dfe6056f53789329b74d3ac4601fdd7aba840202f0a5d41edd99ee5  studiorium-source.tgz' | sha256sum -c -

      - name: Extrair projeto na raiz
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf studiorium-source.tgz --strip-components=1
          rm -f studiorium.b64 studiorium-source.tgz .studiorium.part00 .studiorium.part00a .studiorium.part00b .studiorium.part01 .studiorium.part02 .studiorium.part03 .studiorium.part04 .trigger-import
          rm -f .github/workflows/import-studiorium.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Publicar versão final na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publica Studiorium v2.3'
          git push origin HEAD:${{ github.head_ref }}
