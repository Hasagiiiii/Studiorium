name: V4 Validation Report

on:
  push:
    branches:
      - rebuild/lorion-v4-clean
    paths:
      - 'v4/**'
      - 'SECURITY.md'
      - 'vercel.json'
      - '.github/workflows/v4-validation-report.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate and write report
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          REPORT=.ci/v4-validation-report.txt
          : > "$REPORT"
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$REPORT"

          run_check() {
            name="$1"
            workdir="$2"
            shift 2
            logfile="/tmp/${name}.log"
            (cd "$workdir" && "$@") >"$logfile" 2>&1
            code=$?
            printf '%s=%s\n' "$name" "$code" >> "$REPORT"
            if [ "$code" -ne 0 ]; then
              printf '\n[%s]\n' "$name" >> "$REPORT"
              tail -n 120 "$logfile" >> "$REPORT"
              printf '\n' >> "$REPORT"
            fi
            return 0
          }

          run_check root_install . npm ci --ignore-scripts --no-audit --no-fund
          run_check secrets . node scripts/check-secrets.js
          run_check root_check . npm run check
          run_check root_test . npm run test
          run_check v4_lock v4 npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          run_check v4_install v4 npm ci --ignore-scripts --no-audit --no-fund
          run_check v4_typecheck v4 npm run typecheck
          run_check v4_test v4 npm run test
          run_check v4_build v4 npm run build --workspace @lorion/web

          if grep -Eq '=(1|2|3|4|5|6|7|8|9|[1-9][0-9]+)$' "$REPORT"; then
            printf 'result=failed\n' >> "$REPORT"
          else
            printf 'result=passed\n' >> "$REPORT"
          fi

      - name: Publish report to validation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/v4-validation-report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(v4): atualizar relatório de validação"
          git push origin HEAD:rebuild/lorion-v4-clean
