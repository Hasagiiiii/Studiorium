name: Format V4 Once

on:
  push:
    branches:
      - feat/v4-ui-social-first-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v4-ui-social-first-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format V4
        run: npx prettier --write v4

      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- v4; then
            echo "V4 already formatted."
            exit 0
          fi
          git config user.name "studiorium-ci"
          git config user.email "actions@users.noreply.github.com"
          git add v4
          git commit -m "style(v4): apply prettier baseline"
          git push origin HEAD:feat/v4-ui-social-first-audit
