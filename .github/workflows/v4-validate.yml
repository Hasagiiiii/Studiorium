name: V4 Validate

on:
  push:
    branches:
      - rebuild/lorion-v4-clean
    paths:
      - 'v4/**'
      - '.github/workflows/v4-validate.yml'
  pull_request:
    paths:
      - 'v4/**'
      - '.github/workflows/v4-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v4/package-lock.json

      - name: Install dependencies
        run: npm install --package-lock-only && npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build web
        run: npm run build --workspace @lorion/web
