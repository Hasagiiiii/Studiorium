name: V4 Validate

on:
  pull_request:
    branches:
      - ci/lorion-v4-verify
    paths:
      - 'v4/**'
      - '.github/workflows/v4-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build web
        run: npm run build --workspace @lorion/web
