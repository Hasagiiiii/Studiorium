name: Format UI responsibility test

on:
  push:
    branches:
      - fix/private-own-profile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/private-own-profile
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write tests/ui-responsibility.test.js
      - shell: bash
        run: |
          git add tests/ui-responsibility.test.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(test): apply project formatting"
          git push origin HEAD:fix/private-own-profile
