name: Consolidate UI helper

on:
  push:
    branches:
      - fix/private-own-profile

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/private-own-profile

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Consolidate duplicate hubs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, transform) {
            const before = fs.readFileSync(path, 'utf8');
            const after = transform(before);
            if (after === before) return;
            fs.writeFileSync(path, after);
          }

          edit('public/js/router.js', (text) => text
            .replace(
              "  if (p === '/pesquisas') {\n    return pesquisas();\n  }",
              "  if (p === '/pesquisas') {\n    history.replaceState({}, '', '/biblioteca?tipo=pesquisas');\n    state.query = new URLSearchParams('tipo=pesquisas');\n    return biblioteca();\n  }",
            )
            .replace(
              "  if (p === '/estudio-templates') {\n    return await templateStudio();\n  }",
              "  if (p === '/estudio-templates') {\n    history.replaceState({}, '', '/comunidades/design-templates');\n    return await comunidadeDetalhe('design-templates');\n  }",
            ));

          edit('public/js/views/communities.js', (text) => {
            text = text.replace(
              "import { layout, link, empty, discussionRow } from './core.js';",
              "import { layout, link, empty, discussionRow, templateCard } from './core.js';",
            );
            text = text.replace(
              '${discussionRow(discussion, index)}',
              "${discussionRow(\n      discussion,\n      index,\n      `/comunidades/${encodeURIComponent(community.slug)}/coloquio`,\n    )}",
            );
            const marker = "export async function comunidadeDetalhe(slug, options = {}) {";
            if (!text.includes('function creationCommunityHub(')) {
              const block = `function creationCommunityHub(community) {\n  if (community.slug !== 'design-templates') return '';\n  const templates = state.boot?.templates || [];\n  const communityTemplates = (state.boot?.customTemplates || []).filter(\n    (template) => template.status === 'published',\n  );\n  const createActions = state.me\n    ? html\`<button class=\"solid\" type=\"button\" data-new-custom-template>Criar em branco</button>\n        <label class=\"outline file-button\">\n          Importar arquivo\n          <input data-import-template type=\"file\" accept=\".json,.png,.jpg,.jpeg,.webp,.pdf\" />\n        </label>\n        \${link('/atelie', 'Banner científico', 'outline')}\`\n    : link('/login', 'Entrar para criar', 'solid');\n\n  return html\`<section class=\"community-section creation-community-hub\" id=\"criacao\">\n    <div class=\"sectionhead\">\n      <div>\n        <div class=\"eyebrow\">Creatio</div>\n        <h2>Criação e modelos</h2>\n      </div>\n      <div class=\"actions\">\${createActions}</div>\n    </div>\n    <p class=\"community-section-copy\">\n      Este é o único hub de criação do Studiorium. Explore modelos, crie materiais ou abra uma\n      ferramenta específica sem manter catálogos paralelos.\n    </p>\n    <div class=\"grid grid3\">\n      \${templates.slice(0, 9).map(templateCard).join('') || empty('Nenhum modelo-base disponível.')}\n    </div>\n    \${communityTemplates.length\n      ? html\`<div class=\"sectionhead section-gap\">\n            <div><div class=\"eyebrow\">Communitas</div><h3>Modelos publicados pela comunidade</h3></div>\n          </div>\n          <div class=\"grid grid3\">\n            \${communityTemplates\n              .slice(0, 9)\n              .map(\n                (template) =>\n                  html\`<article class=\"card studio-card\">\n                    <span class=\"badge\">Modelo editável</span>\n                    <h3>\${E(template.title)}</h3>\n                    <p>\${E(template.description || 'Template publicado pela comunidade.')}</p>\n                    \${link(\n                      \`/modelos-livres/\${encodeURIComponent(template.id)}\`,\n                      'Visualizar modelo',\n                      'outline',\n                    )}\n                  </article>\`,\n              )\n              .join('')}\n          </div>\`\n      : ''}\n  </section>\`;\n}\n\n`;
              text = text.replace(marker, block + marker);
            }
            text = text.replace(
              "          ${canManage ? '<a href=\"#gestao\">Gestão</a>' : ''}\n        </nav>",
              "          ${community.slug === 'design-templates' ? '<a href=\"#criacao\">Criação</a>' : ''}\n          ${canManage ? '<a href=\"#gestao\">Gestão</a>' : ''}\n        </nav>\n\n        ${creationCommunityHub(community)}",
            );
            return text;
          });

          edit('public/js/views/template-studio.js', (text) => text
            .replace("${link('/acervo', 'Ver acervo', 'outline')}", "${link('/comunidades/design-templates', 'Voltar à Criação', 'outline')}")
            .replace("${link('/estudio-templates', 'Voltar', 'outline')}", "${link('/comunidades/design-templates', 'Voltar à Criação', 'outline')}"));

          edit('public/js/events/template-studio.js', (text) => text
            .replace("toast('Cópia criada no seu estúdio.');", "toast('Cópia criada na sua coleção.');")
            .replace("if (submit) goto('/estudio-templates');", "if (submit) goto('/comunidades/design-templates');"));

          edit('public/js/views/home-social-widgets.js', (text) => text
            .replace("? link('/estudio-templates', 'Criar agora', 'solid')", "? link('/comunidades/design-templates', 'Criar agora', 'solid')")
            .replace("link('/estudio-templates', 'Criar', 'soft')", "link('/comunidades/design-templates', 'Criar', 'soft')"));

          edit('public/js/views/home-social.js', (text) => text
            .replace("${link('/coloquio', '◌ Discussões')}", "${link('/comunidades', '◌ Discussões')}")
            .replace("${link('/coloquio', '<strong>Discussões</strong>Entre na conversa')}", "${link('/comunidades', '<strong>Discussões</strong>Entre na conversa')}"));
          NODE

      - name: Format changed files
        run: >-
          npx prettier --write
          public/css/profile-social.css
          public/js/router.js
          public/js/views/core.js
          public/js/views/profile-social.js
          public/js/views/workspace-personal-v330.js
          public/js/views/communities.js
          public/js/views/template-studio.js
          public/js/events/template-studio.js
          public/js/views/home-social-widgets.js
          public/js/views/home-social.js
          src/server/routes/profile.js

      - name: Commit consolidation
        shell: bash
        run: |
          git add public src
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): consolidate duplicate hubs"
          git push origin HEAD:fix/private-own-profile
